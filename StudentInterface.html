    .tab-nav {

  <div class="bg-pattern"></div>

  <div class="container">

                   maxlength="11"
                   oninput="this.value = this.value.replace(/[^0-9]/g, '')"

          <h2 class="card-title">출석률 순위</h2>

  <script>
    let countdownInterval;
    let isAttendanceActive = false;
    let currentSeason = '<?= season ?>' || '';
    
    // Confetti Effect
    function createConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      const particles = [];
      const colors = ['#60a5fa', '#3b82f6', '#93bbfc', '#dbeafe', '#fbbf24', '#f59e0b', '#a78bfa', '#e9d5ff'];
      
      for (let i = 0; i < 150; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          vx: Math.random() * 3 - 1.5,
          vy: Math.random() * 3 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 8 + 4,
          angle: Math.random() * 360,
          angleV: Math.random() * 6 - 3
        });
      }
      
      let animationId;
      
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach((p, index) => {
          p.x += p.vx;
          p.y += p.vy;
          p.angle += p.angleV;
          p.vy += 0.1;
          
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle * Math.PI / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
          ctx.restore();
          
          if (p.y > canvas.height) {
            particles.splice(index, 1);
          }
        });
        
        if (particles.length > 0) {
          animationId = requestAnimationFrame(animate);
        } else {
          canvas.style.display = 'none';
        }
      }
      
      canvas.style.display = 'block';
      animate();
      
      setTimeout(() => {
        cancelAnimationFrame(animationId);
        canvas.style.display = 'none';
      }, 5000);
    }
    
    window.onload = function() {
      // 시즌 정보 확인 및 표시
      if (!currentSeason) {
        console.warn('시즌 정보가 없습니다. 관리자 모드로 동작합니다.');
      }
      
      // 출석 세션 정보 가져오기 (시즌별)
      if (currentSeason) {
        google.script.run
          .withSuccessHandler(handleAttendanceSession)
          .withFailureHandler(handleSeasonError)
          .getSeasonAttendanceSession(currentSeason);
      } else {
        google.script.run.withSuccessHandler(handleAttendanceSession).getAttendanceSession();
      }
      
      // 출석률 순위 가져오기 (시즌별)
      loadRankings();
      
      // 로컬 스토리지에 저장된 전화번호가 있으면 자동 입력
      const savedPhone = localStorage.getItem('lastUsedPhone');
      if (savedPhone) {
        document.getElementById('phoneInput').value = savedPhone;
        document.getElementById('statusPhoneInput').value = savedPhone;
      }
      
      // 입력 필드가 제대로 클릭되는지 확인
      document.getElementById('phoneInput').addEventListener('click', function() {
        this.focus();
      });
      document.getElementById('statusPhoneInput').addEventListener('click', function() {
        this.focus();
      });
    };
    
    function loadRankings() {
      if (currentSeason) {
        google.script.run
          .withSuccessHandler(displayRankings)
          .withFailureHandler(handleRankingError)
          .getSeasonAttendanceRanking(currentSeason);
      } else {
        google.script.run
          .withSuccessHandler(displayRankings)
          .withFailureHandler(handleRankingError)
          .getAttendanceRanking();
      }
    }
    
    function displayRankings(response) {
      const rankingBoard = document.getElementById('rankingBoard');
      
      if (!response.success) {
        rankingBoard.innerHTML = `<div class="error">순위를 불러올 수 없습니다: ${response.message || ''}</div>`;
        return;
      }
      
      const rankings = response.data;
      if (rankings.length === 0) {
        rankingBoard.innerHTML = `<p class="info-text">아직 출석 데이터가 없습니다.</p>`;
        return;
      }
      
      let tableHTML = `
        <table class="ranking-table">
          <thead>
            <tr>
              <th>순위</th>
              <th>이름</th>
              <th>출석률</th>
              <th>출석 횟수</th>
              <th>평균 출석 시간</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      rankings.forEach(item => {
        let rankDisplay = '';
        if (item.rank <= 3) {
          rankDisplay = `<span class="rank-medal rank-${item.rank}">${item.rank}</span>`;
        } else {
          rankDisplay = `<span style="color: #94a3b8;">${item.rank}</span>`;
        }
        
        let avgTimeDisplay = item.avgAttendTime;
        if (item.avgAttendTime === "미출석") {
          avgTimeDisplay = `<span style="color: #64748b;">-</span>`;
        } else {
          avgTimeDisplay = `<span style="color: #60a5fa;">${item.avgAttendTime}</span>`;
        }
        
        tableHTML += `
          <tr>
            <td>${rankDisplay}</td>
            <td><span class="grade-badge">${item.grade}</span>${item.name}</td>
            <td><span class="highlight-text">${item.attendanceRate}%</span></td>
            <td>${item.attendedCount}/${item.totalSessions}</td>
            <td>${avgTimeDisplay}</td>
          </tr>
        `;
      });
      
      tableHTML += `
          </tbody>
        </table>
      `;
      
      rankingBoard.innerHTML = tableHTML;
    }
    
    function handleRankingError(error) {
      const rankingBoard = document.getElementById('rankingBoard');
      rankingBoard.innerHTML = `<div class="error">순위를 불러오는 중 오류가 발생했습니다.</div>`;
      console.error('Ranking error:', error);
    }
    
    function handleAttendanceSession(session) {
        const countdownTitle = document.getElementById('countdown-title');
        const countdownDiv = document.getElementById('countdown');
        const attendBtn = document.getElementById('attendBtn');

        clearInterval(countdownInterval);

        if (session.active) {
            countdownTitle.textContent = "출석 마감까지 남은 시간";
            isAttendanceActive = true;
            attendBtn.disabled = false;
            
            const endTime = new Date(session.endTime);

            countdownInterval = setInterval(() => {
                const now = new Date();
                const remainingTime = endTime - now;

                if (remainingTime <= 0) {
                    clearInterval(countdownInterval);
                    countdownTitle.textContent = "출석 시간 종료";
                    countdownDiv.textContent = "00분 00초";
                    isAttendanceActive = false;
                    attendBtn.disabled = true;
                    attendBtn.innerHTML = '<i class="fas fa-times"></i> <span>출석 마감</span>';
                } else {
                    const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);
                    countdownDiv.textContent = `${String(minutes).padStart(2, '0')}분 ${String(seconds).padStart(2, '0')}초`;
                }
            }, 1000);

        } else {
            countdownTitle.textContent = "출석 대기 중";
            countdownDiv.textContent = session.message || "지금은 출석 가능한 시간이 아닙니다.";
            isAttendanceActive = false;
            attendBtn.disabled = true;
            attendBtn.innerHTML = '<i class="fas fa-times"></i> <span>출석 불가</span>';
        }
    }

    function openTab(tabName, evt) {
      document.querySelectorAll(".tab-content").forEach(tc => tc.classList.remove("active"));
      document.querySelectorAll(".tab-button").forEach(tb => tb.classList.remove("active"));
      document.getElementById(tabName).classList.add("active");
      evt.currentTarget.classList.add("active");
      
      if (tabName === 'status') {
        loadRankings();
      }
    }

    function doAttendance(event) {
        event.preventDefault();
        
        const phoneNumber = document.getElementById('phoneInput').value.trim();
        
        if (!phoneNumber) {
            alert("전화번호를 입력해주세요.");
            return;
        }
        
        const phoneRegex = /^010[0-9]{8}$/;
        if (!phoneRegex.test(phoneNumber)) {
            alert("올바른 전화번호 형식이 아닙니다. (예: 01012345678)");
            return;
        }
        
        if (!isAttendanceActive) {
            alert("현재는 출석 가능한 시간이 아닙니다.");
            return;
        }
        
        document.getElementById('attendBtn').disabled = true;
        document.getElementById('attendBtn').innerHTML = '<span class="loader"></span> <span>처리 중...</span>';
        
        localStorage.setItem('lastUsedPhone', phoneNumber);

        if (currentSeason) {
          google.script.run
              .withSuccessHandler(handleAttendanceResponse)
              .withFailureHandler(handleAttendanceError)
              .markSeasonAttendance(phoneNumber, currentSeason);
        } else {
          google.script.run
              .withSuccessHandler(handleAttendanceResponse)
              .withFailureHandler(handleAttendanceError)
              .markAttendance(phoneNumber);
        }
    }
    
    function handleAttendanceResponse(response) {
      const resultDiv = document.getElementById('result');
      const attendBtn = document.getElementById('attendBtn');
      
      if (response.success) {
          createConfetti();
          
          let message = `✅ <span class="grade-badge">${response.grade}</span>${response.name}님, ${response.time} 출석 완료!`;
          
          if (response.attendanceInfo) {
              const info = response.attendanceInfo;
              message += `
                  <div class="attendance-info">
                      <h3><span class="grade-badge">${response.grade}</span>${response.name}님 출석 현황</h3>
                      <div class="attendance-stats">
                          <div class="stat-item">
                              <div class="stat-label">출석 횟수</div>
                              <div class="stat-value">${info.attended}/${info.total}</div>
                          </div>
                          <div class="stat-item">
                              <div class="stat-label">출석률</div>
                              <div class="stat-value highlight">${info.rate}%</div>
                          </div>
                      </div>
                      <p class="info-text" style="margin-top: 12px; font-size: 14px;">
                          현재까지 ${info.currentSession}회차 중 ${info.attended}회 출석
                      </p>
                  </div>
              `;
          }
          
          if (response.fortune) {
              message += `
                  <div class="fortune-card">
                      <h4>
                          <i class="fas fa-star"></i>
                          오늘의 운세
                          <i class="fas fa-star"></i>
                      </h4>
                      <p class="fortune-text">${response.fortune}</p>
                  </div>
              `;
          }
          
          resultDiv.innerHTML = message;
          resultDiv.className = 'success';
          attendBtn.innerHTML = '<i class="fas fa-check-circle"></i> <span>출석 완료</span>';
          clearInterval(countdownInterval);
      } else {
          resultDiv.innerHTML = `❌ ${response.message}`;
          resultDiv.className = 'error';
          attendBtn.disabled = false;
          attendBtn.innerHTML = '<i class="fas fa-hand-point-up"></i> <span>지금 출석하기</span>';
      }
      
      resultDiv.style.display = "block";
      
      setTimeout(() => { 
          resultDiv.style.display = "none"; 
          if (!response.success && isAttendanceActive) {
              attendBtn.disabled = false;
          }
      }, response.success ? 15000 : 5000);
    }
    
    function handleAttendanceError(error) {
      const resultDiv = document.getElementById('result');
      const attendBtn = document.getElementById('attendBtn');
      
      resultDiv.innerHTML = `❌ 오류가 발생했습니다: ${error.message || '알 수 없는 오류'}`;
      resultDiv.className = 'error';
      resultDiv.style.display = "block";
      
      attendBtn.disabled = false;
      attendBtn.innerHTML = '<i class="fas fa-hand-point-up"></i> <span>지금 출석하기</span>';
      
      setTimeout(() => { resultDiv.style.display = "none"; }, 5000);
    }
    
    function checkAttendanceStatus(event) {
      event.preventDefault();
      
      const phoneNumber = document.getElementById('statusPhoneInput').value.trim();
      
      if (!phoneNumber) {
        alert("전화번호를 입력해주세요.");
        return;
      }
      
      const phoneRegex = /^010[0-9]{8}$/;
      if (!phoneRegex.test(phoneNumber)) {
        alert("올바른 전화번호 형식이 아닙니다. (예: 01012345678)");
        return;
      }
      
      localStorage.setItem('lastUsedPhone', phoneNumber);
      
      const statusResult = document.getElementById('statusResult');
      statusResult.innerHTML = '<div class="loader" style="margin: 32px auto;"></div>';
      statusResult.style.display = 'block';
      
      if (currentSeason) {
        google.script.run
          .withSuccessHandler(handleStatusResponse)
          .withFailureHandler(handleStatusError)
          .getSeasonAttendanceStatus(phoneNumber, currentSeason);
      } else {
        google.script.run
          .withSuccessHandler(handleStatusResponse)
          .withFailureHandler(handleStatusError)
          .getAttendanceStatus(phoneNumber);
      }
    }
    
    function handleStatusResponse(response) {
      const statusResult = document.getElementById('statusResult');
      
      if (response.success) {
        const data = response.data;
        let detailsHTML = '';
        
        data.details.forEach(detail => {
          const itemClass = detail.isPast ? '' : 'future';
          let statusClass, statusIcon, statusText;
          
          if (!detail.isPast) {
            statusClass = 'future';
            statusIcon = '<i class="fas fa-clock"></i>';
            statusText = '예정';
          } else if (detail.attended) {
            statusClass = 'present';
            statusIcon = '<i class="fas fa-check-circle"></i>';
            statusText = '출석';
          } else {
            statusClass = 'absent';
            statusIcon = '<i class="fas fa-times-circle"></i>';
            statusText = '결석';
          }
          
          detailsHTML += `
            <div class="attendance-item ${itemClass}">
              <div class="attendance-date">${detail.date}</div>
              <div class="attendance-status ${statusClass}">
                ${statusIcon}
                <span>${statusText}</span>
              </div>
            </div>
          `;
        });
        
        statusResult.innerHTML = `
          <div class="card">
            <div class="attendance-info">
              <h3><span class="grade-badge">${data.grade}</span>${data.name}님 출석 현황</h3>
              <div class="attendance-stats">
                <div class="stat-item">
                  <div class="stat-label">출석 횟수</div>
                  <div class="stat-value">${data.attended}/${data.total}</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">출석률</div>
                  <div class="stat-value highlight">${data.rate}%</div>
                </div>
              </div>
              <p class="info-text" style="margin-top: 12px;">
                현재까지 ${data.currentSession}회차 중 ${data.attended}회 출석
              </p>
            </div>
            <div class="attendance-details">
              <h4 style="color: #e2e8f0; margin-bottom: 16px; font-size: 18px;">출석 상세 내역</h4>
              ${detailsHTML}
            </div>
          </div>
        `;
      } else {
        statusResult.innerHTML = `<div class="error">❌ ${response.message}</div>`;
      }
      
      statusResult.style.display = 'block';
    }
    
    function handleStatusError(error) {
      const statusResult = document.getElementById('statusResult');
      statusResult.innerHTML = `<div class="error">❌ 오류가 발생했습니다: ${error.message || '알 수 없는 오류'}</div>`;
      statusResult.style.display = 'block';
    }
    
    function handleSeasonError(error) {
      console.error('시즌 관련 오류:', error);
      
      // 시즌 관련 오류 시 에러 메시지 표시
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error';
      errorDiv.style.cssText = 'position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 16px 24px; border-radius: 12px; z-index: 1000; max-width: 400px; text-align: center;';
      errorDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> 시즌 '${currentSeason}'를 찾을 수 없습니다. 관리자에게 문의하세요.`;
      document.body.appendChild(errorDiv);
      
      setTimeout(() => {
        errorDiv.remove();
      }, 5000);
      
      // 관리자 모드로 대체
      currentSeason = '';
      google.script.run.withSuccessHandler(handleAttendanceSession).getAttendanceSession();
      loadRankings();
    }
  </script>
</body>
</html>
