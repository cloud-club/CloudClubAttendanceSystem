<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Club Attendance</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .box {
      width: min(92vw, 560px);
      padding: 28px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.8);
    }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { color: #94a3b8; margin: 0 0 20px; }
    a {
      display: block;
      color: #60a5fa;
      text-decoration: none;
      margin: 10px 0;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Cloud Club Attendance</h1>
    <p>관리자 또는 학생 페이지로 이동하세요.</p>
    <a href="./admin/">관리자 페이지</a>
    <a href="./student/">학생 페이지 (season 쿼리 필요)</a>
  </div>
</body>
</html>
