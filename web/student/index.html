<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../images/logo.png" type="image/png">
  <title>출석체크</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="../shared/styles.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e0e0e0;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    .bg-pattern {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, #1e40af20 1px, transparent 1px),
        linear-gradient(to bottom, #1e40af20 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: 0;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 10;
    }
    
    .header {
      text-align: center;
      padding: 40px 0 30px;
      position: relative;
    }
    
    .main-title {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 900;
      margin-bottom: 16px;
      animation: fadeInUp 0.8s ease-out;
      line-height: 1.1;
    }
    
    .gradient-text {
      background: linear-gradient(to right, #60a5fa, #93bbfc, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
    }
    
    .subtitle {
      font-size: 1.1rem;
      color: #94a3b8;
      font-weight: 400;
      margin-bottom: 16px;
      animation: fadeInUp 1s ease-out;
    }
    
    .season-info {
      font-size: 0.9rem;
      color: #60a5fa;
      background: rgba(96, 165, 250, 0.1);
      border: 1px solid rgba(96, 165, 250, 0.2);
      padding: 8px 16px;
      border-radius: 20px;
      margin: 16px auto;
      display: inline-block;
      animation: fadeIn 1.2s ease-out;
    }
    
    .divider {
      width: 96px;
      height: 3px;
      background: linear-gradient(to right, #3b82f6, #60a5fa);
      margin: 24px auto;
      border-radius: 2px;
      animation: fadeIn 1.2s ease-out;
    }
    
    .tab-nav {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 8px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      animation: fadeInUp 0.8s ease-out;
    }
    
    .tab-button {
      background: transparent;
      border: none;
      padding: 12px 24px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #94a3b8;
      border-radius: 16px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    
    .tab-button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
    
    .tab-button.active {
      background: linear-gradient(45deg, #3b82f6, #60a5fa);
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    
    .tab-content {
      display: none;
      animation: fadeIn 0.5s ease-in-out;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      padding: 32px;
      margin-bottom: 32px;
      position: relative;
      overflow: visible;
      transition: all 0.3s ease;
      z-index: 1;
    }
    
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.05) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    .card:hover::before {
      opacity: 1;
    }
    
    .card-header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .card-icon {
      font-size: 28px;
      margin-right: 12px;
      color: #60a5fa;
    }
    
    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }
    
    .countdown-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px;
      margin-bottom: 32px;
      text-align: center;
    }
    
    #countdown {
      font-size: 2.5rem;
      font-weight: 900;
      color: #60a5fa;
      text-shadow: 0 2px 8px rgba(96, 165, 250, 0.3);
      margin-top: 16px;
    }
    
    .form-group {
      margin: 32px auto;
      max-width: 400px;
      text-align: center;
      position: relative;
      z-index: 10;
    }
    
    .form-label {
      display: block;
      margin-bottom: 12px;
      font-weight: 600;
      color: #e2e8f0;
      font-size: 17px;
    }
    
    .form-input {
      width: 100%;
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: #fff;
      font-size: 18px;
      transition: all 0.3s ease;
      text-align: center;
      letter-spacing: 2px;
      font-weight: 500;
      position: relative;
      z-index: 20;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
      background: rgba(255, 255, 255, 0.08);
      z-index: 30;
    }
    
    .form-input::placeholder {
      color: #64748b;
      letter-spacing: 1px;
    }
    
    .btn {
      background: linear-gradient(45deg, #3b82f6, #60a5fa);
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 10;
    }
    
    .btn:hover:enabled {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      background: linear-gradient(45deg, #2563eb, #3b82f6);
    }
    
    .btn:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }
    
    #result, #statusResult {
      margin: 24px auto;
      padding: 16px 24px;
      border-radius: 16px;
      display: none;
      animation: slideDown 0.3s ease-out;
      max-width: 600px;
      font-weight: 600;
      text-align: center;
    }
    
    .success {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    
    .error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    
    .attendance-info {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      padding: 20px;
      margin-top: 16px;
      text-align: center;
    }
    
    .attendance-info h3 {
      color: #60a5fa;
      font-size: 20px;
      margin-bottom: 12px;
    }
    
    .attendance-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 16px;
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-label {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 4px;
    }
    
    .stat-value {
      color: #e2e8f0;
      font-size: 24px;
      font-weight: 700;
    }
    
    .stat-value.highlight {
      color: #60a5fa;
    }
    
    .fortune-card {
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.1), rgba(59, 130, 246, 0.1));
      border: 1px solid rgba(147, 51, 234, 0.3);
      border-radius: 16px;
      padding: 20px;
      margin-top: 16px;
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }
    
    .fortune-card h4 {
      color: #a78bfa;
      font-size: 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .fortune-text {
      color: #e9d5ff;
      font-size: 16px;
      line-height: 1.6;
      font-style: italic;
    }
    
    .attendance-details {
      margin-top: 24px;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .attendance-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    
    .attendance-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    .attendance-item.future {
      opacity: 0.5;
    }
    
    .attendance-date {
      color: #e2e8f0;
      font-weight: 500;
    }
    
    .attendance-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .attendance-status.present {
      color: #4ade80;
    }

    .attendance-status.late {
      color: #f6ad55;
    }
    
    .attendance-status.absent {
      color: #f87171;
    }

    .attendance-status.excused {
      color: #93c5fd;
    }
    
    .attendance-status.future {
      color: #64748b;
    }
    
    .ranking-table {
      width: 100%;
      margin-top: 24px;
      border-collapse: collapse;
    }
    
    .ranking-table th,
    .ranking-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .ranking-table th {
      background: rgba(59, 130, 246, 0.1);
      color: #60a5fa;
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    
    .ranking-table tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .rank-medal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: 700;
      font-size: 14px;
    }
    
    .rank-1 {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #fff;
    }
    
    .rank-2 {
      background: linear-gradient(135deg, #e5e7eb, #9ca3af);
      color: #fff;
    }
    
    .rank-3 {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
    }
    
    .grade-badge {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(59, 130, 246, 0.2);
      color: #93bbfc;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 8px;
    }
    
    .info-card {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      text-align: center;
    }
    
    .info-text {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin: 16px 0;
    }
    
    .highlight-text {
      color: #60a5fa;
      font-weight: 600;
    }
    
    .loader {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #60a5fa;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes fadeInUp {
      from { 
        opacity: 0; 
        transform: translateY(30px);
      }
      to { 
        opacity: 1; 
        transform: translateY(0);
      }
    }
    
    @keyframes slideDown {
      from { 
        opacity: 0; 
        transform: translateY(-10px);
      }
      to { 
        opacity: 1; 
        transform: translateY(0);
      }
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }
      
      .main-title {
        font-size: 2.5rem;
      }
      
      .tab-nav {
        flex-direction: column;
        gap: 8px;
      }
      
      .tab-button {
        justify-content: center;
        width: 100%;
      }
      
      .form-input {
        width: 100%;
      }
      
      #countdown {
        font-size: 2rem;
      }
      
      .attendance-stats {
        flex-direction: column;
        gap: 16px;
      }
      
      .ranking-table {
        font-size: 14px;
      }
      
      .ranking-table th,
      .ranking-table td {
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  
  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>
  
  <div class="container">
    <header class="header">
      <h1 class="main-title">
        <span class="gradient-text">출석체크</span>
      </h1>
      <p class="subtitle">Cloud Club 출석 시스템</p>
      <div class="season-info" id="seasonInfo" style="display: none;"></div>
      <div class="divider"></div>
    </header>
    
    <nav class="tab-nav">
      <button class="tab-button active" onclick="openTab('attend', event)">
        <i class="fas fa-check-circle"></i>
        <span>출석하기</span>
      </button>
      <button class="tab-button" onclick="openTab('status', event)">
        <i class="fas fa-chart-line"></i>
        <span>출석현황</span>
      </button>
    </nav>

    <!-- 출석하기 탭 -->
    <div id="attend" class="tab-content active">
      <div class="countdown-card">
        <h2 id="countdown-title" class="card-title">출석 가능 시간 확인 중...</h2>
        <div id="countdown"><span class="loader"></span></div>
      </div>
      
      <div class="card">
        <form onsubmit="doAttendance(event)" style="text-align: center;">
          <div class="form-group">
            <label for="phoneInput" class="form-label">전화번호 입력</label>
            <input type="tel" 
                   id="phoneInput" 
                   class="form-input" 
                   placeholder="-을 제외한 번호를 입력하세요" 
                   pattern="[0-9]{10,11}"
                   maxlength="11"
                   oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                   required>
            <p class="info-text">하이픈(-) 없이 숫자만 입력해주세요</p>
          </div>
          <button type="submit" id="attendBtn" class="btn" disabled>
            <i class="fas fa-hand-point-up"></i>
            <span>지금 출석하기</span>
          </button>
        </form>
      </div>
      
      <div id="result"></div>
    </div>
    
    <!-- 출석현황 탭 -->
    <div id="status" class="tab-content">
      <div class="card">
        <div class="card-header">
          <i class="fas fa-chart-line card-icon"></i>
          <h2 class="card-title">출석 현황 조회</h2>
        </div>
        <form onsubmit="checkAttendanceStatus(event)" style="text-align: center;">
          <div class="form-group">
            <label for="statusPhoneInput" class="form-label">전화번호 입력</label>
            <input type="tel" 
                   id="statusPhoneInput" 
                   class="form-input" 
                   placeholder="-을 제외한 번호를 입력하세요" 
                   pattern="[0-9]{10,11}"
                   maxlength="11"
                   oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                   required>
            <p class="info-text">하이픈(-) 없이 숫자만 입력해주세요</p>
          </div>
          <button type="submit" class="btn">
            <i class="fas fa-search"></i>
            <span>조회하기</span>
          </button>
        </form>
      </div>
      
      <div id="statusResult"></div>
      
      <!-- 출석률 순위 대시보드 -->
      <div class="card">
        <div class="card-header">
          <i class="fas fa-trophy card-icon"></i>
          <h2 class="card-title">출석률 순위</h2>
        </div>
        <div id="rankingBoard">
          <div class="loader" style="margin: 32px auto;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/env.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/api-jsonp.js"></script>
  <script src="./student.js"></script>
</body>
</html>
